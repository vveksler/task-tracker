apiVersion: v1
kind: ConfigMap
metadata:
  name: task-tracker-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  BACKEND_PORT: {{ .Values.backend.port | quote }}
  FRONTEND_PORT: {{ .Values.frontend.port | quote }}
  JWT_ACCESS_EXPIRES_IN: {{ .Values.backend.jwtAccessExpiresIn | quote }}
  # Backend is reachable within the cluster via its Service name
  BACKEND_INTERNAL_URL: "http://backend:{{ .Values.backend.port }}"
  # Socket.io Redis adapter — pub/sub across HPA replicas
  REDIS_URL: "redis://redis:{{ .Values.redis.port }}"
  FRONTEND_ORIGIN: {{ default (printf "http://%s" .Values.ingress.host) .Values.appUrl | quote }}
  # No TLS in minikube — cookies must not have Secure flag
  COOKIE_SECURE: "false"
  GOOGLE_CALLBACK_URL: {{ .Values.google.callbackUrl | quote }}
  MAIL_PORT: {{ .Values.mail.port | quote }}
  MAIL_FROM: {{ .Values.mail.from | quote }}
{{- if .Values.mail.host }}
  MAIL_HOST: {{ .Values.mail.host | quote }}
{{- end }}
{{- if .Values.google.clientId }}
  GOOGLE_CLIENT_ID: {{ .Values.google.clientId | quote }}
{{- end }}
{{- if .Values.aiAssistant.enabled }}
  # Nest proxies ask/embed to the in-cluster FastAPI service (ClusterIP only).
  AI_ASSISTANT_URL: "http://ai-assistant:{{ .Values.aiAssistant.port }}"
{{- end }}
