# ── Global ──
namespace: task-tracker

# ── PostgreSQL ──
postgres:
  image: postgres:16-alpine
  user: tracker
  password: tracker
  database: task_tracker
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── Redis (Socket.io pub/sub between backend pods) ──
redis:
  image: redis:7-alpine
  port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── Backend (NestJS) ──
backend:
  image: task-tracker-backend:latest
  imagePullPolicy: Never          # minikube uses local images
  replicas: 1
  port: 3001
  jwtAccessSecret: k8s-access-secret-change-in-prod
  jwtAccessExpiresIn: "15m"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilization: 70

# ── Frontend (Next.js) ──
frontend:
  image: task-tracker-frontend:latest
  imagePullPolicy: Never
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilization: 70

# ── Ingress ──
ingress:
  enabled: true
  className: nginx
  host: task-tracker.local

# Public app origin (cookies, OAuth redirects, CORS). Defaults to ingress host.
# For Google OAuth local testing set to http://localhost:3000 in values-local.yaml
# (Google rejects *.local redirect URIs).
appUrl: ""

# ── Optional: Google OAuth ──
# Leave empty to disable. Callback must match Google Cloud Console redirect URI.
google:
  clientId: ""
  clientSecret: ""
  callbackUrl: "http://task-tracker.local/api/auth/google/callback"

# ── Email (verification + password reset) ──
# Prefer Resend on Railway (Hobby blocks SMTP). Empty both → mail disabled.
mail:
  resendApiKey: ""
  host: ""
  port: "587"
  user: ""
  pass: ""
  from: "Task Tracker <noreply@task-tracker.local>"
