services:
  postgres:
    # pgvector image — same Postgres 16, plus the vector extension the
    # RAG assistant needs. Creds/DB name unchanged from the alpine image.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: task_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d task_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Socket.io pub/sub bus between backend instances.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: "postgresql://tracker:tracker@postgres:5432/task_tracker?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "docker-access-secret-change-in-prod"
      JWT_ACCESS_EXPIRES_IN: "15m"
      JWT_REFRESH_SECRET: "docker-refresh-secret-change-in-prod"
      JWT_REFRESH_EXPIRES_IN: "7d"
      FRONTEND_ORIGIN: "http://localhost:3000"
      PORT: "3001"
      NODE_ENV: "production"
      AI_ASSISTANT_URL: "http://ai-assistant:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-assistant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  ai-assistant:
    build: ./ai-assistant
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://tracker:tracker@postgres:5432/task_tracker"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3001"
        NEXT_PUBLIC_WS_URL: "http://localhost:3001"
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Server-side calls go to the internal Docker network
      BACKEND_INTERNAL_URL: "http://backend:3001"
      # Client-side calls go through the browser (host network)
      NEXT_PUBLIC_API_URL: "http://localhost:3001"
      NEXT_PUBLIC_WS_URL: "http://localhost:3001"
    depends_on:
      backend:
        condition: service_healthy

  # One-shot: run migrations after backend is healthy
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: "postgresql://tracker:tracker@postgres:5432/task_tracker?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
