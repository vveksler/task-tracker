{{- if .Values.aiAssistant.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    {{- include "task-tracker.selectorLabels" (dict "component" "ai-assistant") | nindent 4 }}
spec:
  replicas: {{ .Values.aiAssistant.replicas }}
  selector:
    matchLabels:
      {{- include "task-tracker.selectorLabels" (dict "component" "ai-assistant") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "task-tracker.selectorLabels" (dict "component" "ai-assistant") | nindent 8 }}
    spec:
      # Wait for Postgres + schema (embeddings migration) before accepting traffic.
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres TCP..."
              until nc -z postgres 5432; do
                sleep 2
              done
              echo "Postgres TCP is ready"
        - name: wait-for-migrations
          image: {{ .Values.backend.image }}
          imagePullPolicy: {{ .Values.backend.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              echo "Waiting for migrations (checking _prisma_migrations table)..."
              until npx prisma migrate status 2>&1 | grep -q "Database schema is up to date"; do
                echo "Schema not ready yet, waiting..."
                sleep 3
              done
              echo "Migrations are complete"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: DATABASE_URL
      containers:
        - name: ai-assistant
          image: {{ .Values.aiAssistant.image }}
          imagePullPolicy: {{ .Values.aiAssistant.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.aiAssistant.port }}
          env:
            - name: PORT
              value: {{ .Values.aiAssistant.port | quote }}
            # asyncpg DSN — no Prisma ?schema= query param
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: AI_DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: OPENAI_API_KEY
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: ANTHROPIC_API_KEY
          resources:
            {{- toYaml .Values.aiAssistant.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.aiAssistant.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.aiAssistant.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
{{- end }}
